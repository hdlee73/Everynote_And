name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/checkout@v4
        with:
          repository: sanguneo/rhwptopdf
          ref: adbc4bf0f5c6e041ed65b0dbc8aa6b810990a48b
          path: .hwp-engine-source
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .hwp-engine-source
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.13.1'
      - name: Prepare Korean TTC regression font
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Test and build offline HWP engine
        env:
          PDFNOTE_TEST_FONT: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
        run: python3 tools/prepare_hwp_engine.py
      - name: Build debug and release APKs
        run: gradle testDebugUnitTest assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Note-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="v$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)"
          fi
          cp app/build/outputs/apk/release/app-release.apk "PDF-Note-$VERSION.apk"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "PDF-Note-$VERSION.apk" --clobber
          else
            gh release create "$VERSION" "PDF-Note-$VERSION.apk" --title "PDF Note $VERSION" --generate-notes --target "$GITHUB_SHA"
          fi
