name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/checkout@v4
        with:
          repository: sanguneo/rhwptopdf
          ref: adbc4bf0f5c6e041ed65b0dbc8aa6b810990a48b
          path: .hwp-engine-source
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .hwp-engine-source
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.13.1'
      - name: Prepare Korean TTC regression font
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Test and build offline HWP engine
        env:
          PDFNOTE_TEST_FONT: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
        run: python3 tools/prepare_hwp_engine.py
      - name: Build debug and release APKs
        run: set -o pipefail; gradle testDebugUnitTest assembleDebug assembleRelease 2>&1 | tee build.log
      - name: Report failing tests as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import glob,re,os,xml.etree.ElementTree as ET
          n=0
          if os.path.exists('build.log') and not glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              errs=[l.strip() for l in open('build.log',errors='ignore') if re.search(r'error:|symbol:|location:|What went wrong',l)]
              for l in errs[:10]: print('::error title=build::'+l[:400].replace('%','%25'))
          for f in sorted(glob.glob('app/build/test-results/testDebugUnitTest/*.xml')):
              for case in ET.parse(f).getroot().iter('testcase'):
                  for bad in list(case.findall('failure'))+list(case.findall('error')):
                      n+=1
                      if n>9: continue
                      msg=((bad.get('message') or '')+' | '+(bad.text or '')[:700]).replace('%','%25').replace('\r','').replace('\n','%0A')
                      print('::error title=%s.%s::%s'%(case.get('classname').split('.')[-1],case.get('name'),msg[:1200]))
          print('failing tests: %d'%n)
          PY
      - name: Upload selection test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selection-test-results
          path: |
            app/build/test-results/testDebugUnitTest
            app/build/test-screenshots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Everynote-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="v$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)"
          fi
          cp app/build/outputs/apk/release/app-release.apk "Everynote-$VERSION.apk"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "Everynote-$VERSION.apk" --clobber
          else
            gh release create "$VERSION" "Everynote-$VERSION.apk" --title "Everynote $VERSION" --notes-file RELEASE_NOTES.md --target "$GITHUB_SHA"
          fi
      - name: Publish test APK (pre-release, signed like the release)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)"
          cp app/build/outputs/apk/release/app-release.apk "Everynote-$VERSION-test.apk"
          gh release delete test-latest --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create test-latest "Everynote-$VERSION-test.apk" --prerelease --title "테스트 빌드 $VERSION (PR #${{ github.event.pull_request.number }})" --notes "릴리스 전 확인용 APK입니다. 정식 릴리스와 같은 서명이라 정식 앱 위에 바로 설치(업데이트)됩니다." --target "${{ github.event.pull_request.head.sha }}"
