plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hdlee.pdfnote'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hdlee.pdfnote'
        minSdk 26
        targetSdk 35
        versionCode 17
        versionName '1.11.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            // A dedicated Play Store release should use a private keystore.
            // GitHub Releases use Android's standard debug key so the APK is directly installable.
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'kr.dogfoot:hwplib:1.1.11'
    implementation 'org.apache.poi:poi-scratchpad:5.2.5'
    implementation 'org.tukaani:xz:1.10'
}
