plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hdlee.pdfnote'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hdlee.pdfnote'
        minSdk 26
        targetSdk 35
        versionCode 28
        versionName '1.19.1'
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all { testLogging { exceptionFormat = 'full' } }
    }

    buildTypes {
        release {
            minifyEnabled false
            // A dedicated Play Store release should use a private keystore.
            // GitHub Releases use Android's standard debug key so the APK is directly installable.
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'kr.dogfoot:hwplib:1.1.11'
    implementation 'org.apache.poi:poi-scratchpad:5.2.5'
    implementation 'org.tukaani:xz:1.10'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
